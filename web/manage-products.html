<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Product Management - CANO Admin</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <link rel="icon" type="image/png" href="images/icons/favicon.png" />
        <style>
            body {
                background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
                font-family: 'Poppins', sans-serif;
                color: #fff;
                margin: 0;
                min-height: 100vh;
            }

            /* Sidebar */
            .sidebar {
                width: 80px;
                background: rgba(43, 43, 43, 0.95);
                backdrop-filter: blur(10px);
                border-right: 1px solid rgba(255,255,255,0.1);
                transition: width 0.3s ease;
                position: fixed;
                left: 0;
                top: 0;
                height: 100vh;
                z-index: 1000;
                overflow: hidden;
            }

            .sidebar.expanded {
                width: 250px;
            }

            .sidebar-content {
                padding: 1rem;
                height: 100%;
                display: flex;
                flex-direction: column;
            }

            .toggle-btn {
                background: rgba(255,255,255,0.1);
                border: none;
                color: #fff;
                font-size: 20px;
                width: 45px;
                height: 45px;
                border-radius: 10px;
                cursor: pointer;
                transition: all 0.3s;
                display: flex;
                align-items: center;
                justify-content: center;
                margin-bottom: 1.5rem;
            }

            .toggle-btn:hover {
                background: rgba(255,255,255,0.2);
                transform: scale(1.05);
            }

            .sidebar .nav-link {
                color: #d1d5db;
                display: flex;
                align-items: center;
                gap: 15px;
                padding: 12px;
                border-radius: 10px;
                transition: all 0.3s;
                text-decoration: none;
                position: relative;
                overflow: hidden;
            }

            .sidebar .nav-link i {
                font-size: 20px;
                min-width: 25px;
                text-align: center;
                z-index: 1;
            }

            .sidebar .nav-link span {
                opacity: 0;
                white-space: nowrap;
                transition: opacity 0.3s ease;
                z-index: 1;
            }

            .sidebar.expanded .nav-link span {
                opacity: 1;
            }

            .sidebar .nav-link:hover {
                background: rgba(255,255,255,0.15);
                color: #fff;
                transform: translateX(5px);
            }

            .sidebar .nav-link.active {
                background: rgba(74, 222, 128, 0.2);
                color: #4ade80;
            }

            .sidebar .nav-link.active::before {
                content: '';
                position: absolute;
                left: 0;
                top: 0;
                height: 100%;
                width: 4px;
                background: #4ade80;
                border-radius: 0 4px 4px 0;
            }

            .nav-bottom {
                margin-top: auto;
            }

            .nav-bottom .btn {
                width: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                padding: 12px;
                border-radius: 10px;
                transition: all 0.3s;
            }

            .nav-bottom .btn i {
                font-size: 18px;
            }

            .nav-bottom .btn span {
                opacity: 0;
                transition: opacity 0.3s;
            }

            .sidebar.expanded .nav-bottom .btn span {
                opacity: 1;
            }

            .nav-bottom .btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 4px 12px rgba(220, 38, 38, 0.4);
            }

            /* Main Content */
            .main-content {
                margin-left: 80px;
                transition: margin-left 0.3s ease;
                min-height: 100vh;
                padding: 2rem;
            }

            .main-content.shifted {
                margin-left: 250px;
            }

            /* Page Header */
            .page-header {
                margin-bottom: 2rem;
            }

            .page-header h2 {
                font-size: 2rem;
                font-weight: 700;
                color: #fff;
            }

            /* Cards */
            .card {
                background: rgba(255,255,255,0.1) !important;
                backdrop-filter: blur(8px);
                border: 1px solid rgba(255,255,255,0.15) !important;
                border-radius: 15px !important;
                box-shadow: 0 4px 20px rgba(0,0,0,0.4);
                transition: all 0.3s;
                margin-bottom: 2rem;
            }

            .card-header {
                background: linear-gradient(135deg, #4ade80, #22c55e) !important;
                color: #fff !important;
                font-weight: 700 !important;
                border: none !important;
                padding: 1rem 1.5rem !important;
                border-radius: 15px 15px 0 0 !important;
                font-size: 1.1rem;
            }

            .card-body {
                padding: 1.5rem;
            }

            /* Form Elements */
            .form-label {
                color: #fff;
                font-weight: 600;
                margin-bottom: 0.5rem;
                font-size: 0.9rem;
            }

            .form-control,
            .form-select {
                background: rgba(255,255,255,0.1) !important;
                border: 1px solid rgba(255,255,255,0.2) !important;
                color: #fff !important;
                padding: 0.6rem 1rem;
                border-radius: 8px;
                transition: all 0.3s;
            }

            .form-control:focus,
            .form-select:focus {
                background: rgba(255,255,255,0.15) !important;
                border-color: #4ade80 !important;
                color: #fff !important;
                box-shadow: 0 0 0 0.2rem rgba(74, 222, 128, 0.25) !important;
            }

            .form-control::placeholder {
                color: rgba(255,255,255,0.5);
            }

            .form-select option {
                background: #2b2b2b;
                color: #fff;
            }

            textarea.form-control {
                resize: vertical;
            }

            /* Buttons */
            .btn-success {
                background: linear-gradient(135deg, #4ade80, #22c55e) !important;
                border: none !important;
                font-weight: 700;
                padding: 0.8rem 2rem;
                border-radius: 10px;
                transition: all 0.3s;
            }

            .btn-success:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(74, 222, 128, 0.4);
            }

            .btn-outline-danger {
                border: 2px solid #ef4444 !important;
                color: #ef4444 !important;
                background: transparent !important;
                font-weight: 700;
                padding: 0.8rem 2rem;
                border-radius: 10px;
                transition: all 0.3s;
            }

            .btn-outline-danger:hover {
                background: #ef4444 !important;
                color: #fff !important;
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
            }

            .btn-outline-dark {
                border: 2px solid rgba(255,255,255,0.3) !important;
                color: #fff !important;
                background: rgba(255,255,255,0.05) !important;
                font-weight: 700;
                padding: 0.8rem 2rem;
                border-radius: 10px;
                transition: all 0.3s;
            }

            .btn-outline-dark:hover {
                background: rgba(255,255,255,0.15) !important;
                border-color: rgba(255,255,255,0.5) !important;
                transform: translateY(-2px);
            }

            .btn-warning {
                background: linear-gradient(135deg, #f59e0b, #d97706) !important;
                border: none !important;
                color: #fff !important;
                transition: all 0.3s;
            }

            .btn-warning:hover {
                transform: scale(1.05);
                box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
            }

            .btn-danger {
                background: linear-gradient(135deg, #ef4444, #dc2626) !important;
                border: none !important;
                transition: all 0.3s;
            }

            .btn-danger:hover {
                transform: scale(1.05);
                box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
            }

            /* Table */
            .table-container {
                max-height: 500px;
                overflow-y: auto;
                overflow-x: auto;
                border-radius: 10px;
                background: rgba(255,255,255,0.05);
            }

            .table {
                margin-bottom: 0;
                color: #fff;
            }

            .table thead th {
                background: rgba(43, 43, 43, 0.95) !important;
                color: #fff !important;
                font-weight: 700;
                border: none !important;
                padding: 1rem;
                position: sticky;
                top: 0;
                z-index: 10;
                white-space: nowrap;
            }

            .table tbody td {
                background: rgba(255,255,255,0.05);
                border-color: rgba(255,255,255,0.1) !important;
                padding: 1rem;
                vertical-align: middle;
            }

            .table-striped tbody tr:nth-of-type(odd) td {
                background: rgba(255,255,255,0.08);
            }

            .table-hover tbody tr:hover td {
                background: rgba(74, 222, 128, 0.1);
            }

            /* Divider */
            .divider {
                border: none;
                border-top: 2px solid rgba(255,255,255,0.2);
                margin: 3rem 0;
                border-radius: 5px;
            }

            /* Alert Messages */
            .text-danger {
                color: #fca5a5 !important;
            }

            /* File Input */
            .form-control[type="file"] {
                padding: 0.5rem;
            }

            .form-control[type="file"]::file-selector-button {
                background: rgba(74, 222, 128, 0.2);
                border: 1px solid #4ade80;
                color: #4ade80;
                padding: 0.4rem 1rem;
                border-radius: 5px;
                margin-right: 1rem;
                cursor: pointer;
                transition: all 0.3s;
            }

            .form-control[type="file"]::file-selector-button:hover {
                background: rgba(74, 222, 128, 0.3);
            }

            /* Scrollbar */
            ::-webkit-scrollbar {
                width: 10px;
                height: 10px;
            }

            ::-webkit-scrollbar-track {
                background: rgba(255,255,255,0.05);
                border-radius: 5px;
            }

            ::-webkit-scrollbar-thumb {
                background: rgba(74, 222, 128, 0.5);
                border-radius: 5px;
            }

            ::-webkit-scrollbar-thumb:hover {
                background: rgba(74, 222, 128, 0.7);
            }

            /* Responsive */
            @media (max-width: 768px) {
                .main-content {
                    margin-left: 80px;
                    padding: 1rem;
                }

                .main-content.shifted {
                    margin-left: 80px;
                }

                .sidebar.expanded {
                    width: 80px;
                }

                .page-header h2 {
                    font-size: 1.5rem;
                }

                .btn-success,
                .btn-outline-danger,
                .btn-outline-dark {
                    width: 100% !important;
                    margin-top: 1rem !important;
                }
            }
        </style>
    </head>
    <body onload="loadProductData();">
        <!-- Sidebar -->
        <nav id="sidebar" class="sidebar">
            <div class="sidebar-content">
                <button class="toggle-btn" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>

                <ul class="nav flex-column gap-2">
                    <li class="nav-item">
                        <a href="admin-dashboard.html" class="nav-link">
                            <i class="fas fa-chart-line"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="manage-products.html" class="nav-link active">
                            <i class="fas fa-tshirt"></i>
                            <span>Products</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="manage-orders.html" class="nav-link">
                            <i class="fas fa-box"></i>
                            <span>Orders</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="manage-users.html" class="nav-link">
                            <i class="fas fa-users"></i>
                            <span>Users</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="reports.html" class="nav-link">
                            <i class="fas fa-file-alt"></i>
                            <span>Reports</span>
                        </a>
                    </li>
                </ul>

                <div class="nav-bottom">
                    <button onclick="logout();" class="btn btn-danger">
                        <i class="fas fa-sign-out-alt"></i>
                        <!--<span>Logout</span>-->
                    </button>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div id="mainContent" class="main-content">
            <div class="page-header">
                <h2><i class="fas fa-tshirt me-2"></i>Product Management</h2>
            </div>

            <!-- Product Form -->
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-plus-circle me-2"></i>Add / Update Product
                </div>
                <div class="card-body">
                    <form id="product-form" method="post">
                        <input type="hidden" id="productId" name="productId" />

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Product Title</label>
                                <input type="text" class="form-control" id="productTitle" placeholder="Enter product title" required>
                            </div>
                            <div class="col-md-3 mb-3">
                                <label class="form-label">Quantity</label>
                                <input type="number" class="form-control" id="productQty" min="1" value="1" required>
                            </div>
                            <div class="col-md-3 mb-3">
                                <label class="form-label">Price (LKR)</label>
                                <input type="number" class="form-control" id="productPrice" pattern="^\d+(\.\d{2})?$" placeholder="0.00" required>
                            </div>
                            <div class="col-md-12 mb-4">
                                <label class="form-label">Product Description</label>
                                <textarea class="form-control" id="productDesc" rows="3" placeholder="Enter product description" required></textarea>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Product Weight (G)</label>
                                <input type="text" class="form-control" id="productWeight" placeholder="e.g., 250" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Product Dimensions (CM)</label>
                                <input type="text" class="form-control" id="productDimension" placeholder="e.g., 30x20x5" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Product Materials</label>
                                <input type="text" class="form-control" id="productMaterial" placeholder="e.g., Cotton" required>
                            </div>

                            <div class="col-md-3 mb-4">
                                <label class="form-label">Color</label>
                                <select class="form-select" id="productColor" required>
                                    <option value="0">Select Color</option>
                                </select>
                            </div>

                            <div class="col-md-3 mb-4">
                                <label class="form-label">Category</label>
                                <select class="form-select" id="productCategory" required>
                                    <option value="0">Select Category</option>
                                </select>
                            </div>

                            <div class="col-md-3 mb-4">
                                <label class="form-label">Type</label>
                                <select class="form-select" id="productType" required>
                                    <option value="0">Select Type</option>
                                </select>
                            </div>

                            <div class="col-md-3 mb-4">
                                <label class="form-label">Size</label>
                                <select class="form-select" id="productSize" required>
                                    <option value="0">Select Size</option>
                                </select>
                            </div>
                        </div>

                        <!-- Image Uploads -->
                        <div class="row mb-4">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Product Image 1</label>
                                <input type="file" class="form-control" id="productImage1" name="image1" accept="image/*" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Product Image 2</label>
                                <input type="file" class="form-control" id="productImage2" name="image2" accept="image/*" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Product Image 3</label>
                                <input type="file" class="form-control" id="productImage3" name="image3" accept="image/*" required>
                            </div>
                        </div>

                        <p class="text-danger fw-bold" id="message"></p>

                        <div class="d-flex gap-3 flex-wrap">
                            <button onclick="saveProduct();" id="saveBtn" type="submit" class="btn btn-success" style="width: 250px; height: 50px;">
                                <i class="fas fa-save me-2"></i>Save Product
                            </button>
                            <button onclick="resetProductForm();" id="resetBtn" type="button" class="btn btn-outline-danger" style="width: 250px; height: 50px;">
                                <i class="fas fa-undo me-2"></i>Reset
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <hr class="divider">

            <!-- Product List Table -->
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-list me-2"></i>Product List
                </div>
                <div class="card-body p-0">
                    <div class="table-container">
                        <table class="table table-striped table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>Title</th>
                                    <th>Qty</th>
                                    <th>Price (LKR)</th>
                                    <th>Description</th>
                                    <th>Weight (g)</th>
                                    <th>Dimensions (cm)</th>
                                    <th>Material</th>
                                    <th>Color</th>
                                    <th>Category</th>
                                    <th>Type</th>
                                    <th>Size</th>
                                    <th style="width: 120px;">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="productTable">
                                <tr>
                                    <td colspan="12" class="text-center py-4">
                                        <i class="fas fa-spinner fa-spin me-2"></i>Loading...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="p-4">
                        <button onclick="printProductTable()" type="button" class="btn btn-outline-dark" style="width: 300px; height: 50px;">
                            <i class="fas fa-print me-2"></i>Print Product List
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Scripts -->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/product-listing.js"></script>
        <script src="js/manage-products.js"></script>
        <script>
                    function toggleSidebar() {
                        const sidebar = document.getElementById('sidebar');
                        const mainContent = document.getElementById('mainContent');
                        sidebar.classList.toggle('expanded');
                        mainContent.classList.toggle('shifted');
                    }
        </script>
    </body>
</html>
